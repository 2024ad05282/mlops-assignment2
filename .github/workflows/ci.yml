# ============================================================
# GitHub Actions CI/CD Pipeline
# MLOps Assignment 2 - CI Build + CD via Self-Hosted Runner
# ============================================================
# Job 1 (test):      Run unit tests on ubuntu-latest
# Job 2 (build-ci):  Build & push Docker image to GHCR (ubuntu-latest)
# Job 3 (deploy-cd): Pull & deploy on local machine (self-hosted Windows)

name: CI/CD Pipeline - Build, Test, Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: catdog-classifier
  PYTHON_VERSION: "3.13"

jobs:
  # ─── Job 1: Test ─────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch for CI (no GPU in GitHub Actions)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi uvicorn python-multipart Pillow numpy scikit-learn matplotlib mlflow pytest
          pip install -r requirements.txt || true

      - name: Run Unit Tests
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ─── Job 2: Build & Publish Docker Image (Cloud) ──────────────
  build-ci:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    needs: test  # Only build if tests pass
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          # Lowercase the owner name to prevent docker tagging issues
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER}/${{ env.DOCKER_IMAGE_NAME }}"
          
          docker build \
            -t ${IMAGE_TAG}:${{ github.sha }} \
            -t ${IMAGE_TAG}:latest \
            .

      - name: Push Docker Image to GHCR
        if: github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER}/${{ env.DOCKER_IMAGE_NAME }}"
          
          docker push ${IMAGE_TAG}:${{ github.sha }}
          docker push ${IMAGE_TAG}:latest

  # ─── Job 3: Deploy on Local Machine (Self-Hosted Runner via Docker Compose) ───
  deploy-cd:
    name: Deploy to Local Machine (CD)
    runs-on: [self-hosted, windows]
    needs: build-ci
    if: github.event_name == 'push'  # Only deploy on push to main
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Pull Latest Docker Compose Image
        run: |
          Write-Host "Pulling latest image defined in docker-compose.yml..."
          docker compose pull

      - name: Stop Existing Services (docker compose down)
        run: |
          Write-Host "Stopping and removing existing docker-compose containers..."
          docker compose down

      - name: Deploy New Container (docker compose up -d)
        run: |
          Write-Host "Starting inference service in detached mode..."
          docker compose up -d
          Write-Host "Service started! Checking running containers:"
          docker compose ps

      - name: Post-Deploy Smoke Test (Invoke-RestMethod Health Check)
        run: |
          Write-Host "=== POST-DEPLOY SMOKE TEST ==="
          Write-Host "Waiting for service to be healthy at http://localhost:8000/health..."
          
          $maxRetries = 12
          $retryDelay = 5
          $ready = $false
          $healthUrl = "http://localhost:8000/health"

          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              $response = Invoke-RestMethod -Uri $healthUrl -Method Get -TimeoutSec 5
              if ($response.status -eq "healthy") {
                Write-Host "Success: Health check returned 200 OK and status 'healthy'! (Attempt $i/$maxRetries)"
                Write-Host "Response Payload:"
                $response | ConvertTo-Json -Depth 3 | Write-Host
                $ready = $true
                break
              }
            } catch {
              Write-Host "Service not ready yet (Attempt $i/$maxRetries)... waiting $($retryDelay)s"
            }
            Start-Sleep -Seconds $retryDelay
          }

          if (-not $ready) {
            Write-Error "FAILED: Post-deployment health check failed after $maxRetries attempts!"
            docker compose logs
            exit 1
          }

      - name: Print Deployment Summary
        if: success()
        run: |
          Write-Host ""
          Write-Host "============================================="
          Write-Host "  CD DEPLOYMENT SUCCESSFUL VIA DOCKER COMPOSE"
          Write-Host "  API running at: http://localhost:8000"
          Write-Host "  Health:   http://localhost:8000/health"
          Write-Host "  Predict:  http://localhost:8000/predict"
          Write-Host "  Metrics:  http://localhost:8000/metrics"
          Write-Host "============================================="

      - name: Print Container Logs on Failure
        if: failure()
        run: |
          Write-Host "=== CONTAINER LOGS ==="
          docker compose logs
