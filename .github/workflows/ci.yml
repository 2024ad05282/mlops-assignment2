# ============================================================
# GitHub Actions CI/CD Pipeline
# MLOps Assignment 2 - CI Build + CD via Self-Hosted Runner
# ============================================================
# Job 1 (test):      Run unit tests on ubuntu-latest
# Job 2 (build-ci):  Build & push Docker image to GHCR (ubuntu-latest)
# Job 3 (deploy-cd): Pull & deploy on local machine (self-hosted Windows)

name: CI/CD Pipeline - Build, Test, Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_IMAGE_NAME: catdog-classifier
  PYTHON_VERSION: "3.13"

jobs:
  # ─── Job 1: Test ─────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch for CI (no GPU in GitHub Actions)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi uvicorn python-multipart Pillow numpy scikit-learn matplotlib mlflow pytest
          pip install -r requirements.txt || true

      - name: Run Unit Tests
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ─── Job 2: Build & Publish Docker Image (Cloud) ──────────────
  build-ci:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    needs: test  # Only build if tests pass
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          # Lowercase the owner name to prevent docker tagging issues
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER}/${{ env.DOCKER_IMAGE_NAME }}"
          
          docker build \
            -t ${IMAGE_TAG}:${{ github.sha }} \
            -t ${IMAGE_TAG}:latest \
            .

      - name: Push Docker Image to GHCR
        if: github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER}/${{ env.DOCKER_IMAGE_NAME }}"
          
          docker push ${IMAGE_TAG}:${{ github.sha }}
          docker push ${IMAGE_TAG}:latest

  # ─── Job 3: Deploy on Local Machine (Self-Hosted Runner) ──────
  deploy-cd:
    name: Deploy to Local Machine (CD)
    runs-on: [self-hosted, windows]
    needs: build-ci
    if: github.event_name == 'push'  # Only deploy on push to main
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          docker login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Pull Latest Image from GHCR
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          $image = "ghcr.io/$owner/${{ env.DOCKER_IMAGE_NAME }}:latest"
          Write-Host "Pulling image: $image"
          docker pull $image

      - name: Stop & Remove Old Container (if running)
        run: |
          $existing = docker ps -a -q -f "name=catdog-inference-container"
          if ($existing) {
            Write-Host "Stopping and removing existing container..."
            docker stop catdog-inference-container
            docker rm catdog-inference-container
          } else {
            Write-Host "No existing container found. Ready to deploy fresh."
          }

      - name: Deploy New Container
        run: |
          $owner = "${{ github.repository_owner }}".ToLower()
          $image = "ghcr.io/$owner/${{ env.DOCKER_IMAGE_NAME }}:latest"
          
          Write-Host "Deploying container from: $image"
          docker run -d `
            --name catdog-inference-container `
            -p 8000:8000 `
            -e MODEL_PATH=models/cat_dog_cnn.pt `
            -e PYTHONUNBUFFERED=1 `
            $image
          
          Write-Host "Container deployed!"
          docker ps

      - name: Wait for Service to Start
        run: |
          Write-Host "Waiting for service to become ready..."
          $maxRetries = 12
          $retryDelay = 5
          $ready = $false
          
          for ($i = 1; $i -le $maxRetries; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8000/health" -TimeoutSec 5 -UseBasicParsing
              if ($response.StatusCode -eq 200) {
                Write-Host "Service is UP! (attempt $i/$maxRetries)"
                $ready = $true
                break
              }
            } catch {
              Write-Host "Not ready yet... retry $i/$maxRetries"
            }
            Start-Sleep -Seconds $retryDelay
          }
          
          if (-not $ready) {
            Write-Host "ERROR: Service did not start in time!"
            docker logs catdog-inference-container
            exit 1
          }

      - name: Smoke Test - Health Check
        run: |
          Write-Host "=== SMOKE TEST: Health Check ==="
          $response = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing
          $health = $response.Content | ConvertFrom-Json
          
          Write-Host "Status  : $($health.status)"
          Write-Host "Version : $($health.version)"
          Write-Host "Model   : loaded=$($health.model.loaded)"
          Write-Host "Device  : $($health.model.device)"
          
          if ($health.status -ne "healthy") {
            Write-Host "FAILED: Health check returned unhealthy status!"
            exit 1
          }
          if ($health.model.loaded -ne $true) {
            Write-Host "FAILED: Model is not loaded!"
            exit 1
          }
          Write-Host "Health check PASSED!"

      - name: Smoke Test - Prediction
        run: |
          Write-Host "=== SMOKE TEST: Prediction ==="
          
          # Create a test image using Python
          python -c "from PIL import Image; img = Image.new('RGB', (128, 128), color=(255, 100, 50)); img.save('test_smoke_image.jpg', format='JPEG'); print('Test image created.')"
          
          # Send prediction request using curl
          $result = curl.exe -s -X POST "http://localhost:8000/predict" -F "file=@test_smoke_image.jpg;type=image/jpeg"
          $pred = $result | ConvertFrom-Json
          
          Write-Host "Predicted  : $($pred.prediction)"
          Write-Host "Confidence : $($pred.confidence)"
          Write-Host "Probs      : $($pred.probabilities)"
          
          if ($pred.prediction -notin @("Cat", "Dog")) {
            Write-Host "FAILED: Invalid prediction!"
            exit 1
          }
          
          # Cleanup
          Remove-Item -Path "test_smoke_image.jpg" -ErrorAction SilentlyContinue
          Write-Host "Prediction test PASSED!"

      - name: Print Deployment Summary
        if: success()
        run: |
          Write-Host ""
          Write-Host "============================================="
          Write-Host "  CD DEPLOYMENT SUCCESSFUL!"
          Write-Host "  API running at: http://localhost:8000"
          Write-Host "  Health:   http://localhost:8000/health"
          Write-Host "  Predict:  http://localhost:8000/predict"
          Write-Host "  Metrics:  http://localhost:8000/metrics"
          Write-Host "============================================="

      - name: Print Container Logs on Failure
        if: failure()
        run: |
          Write-Host "=== CONTAINER LOGS ==="
          $existing = docker ps -a -q -f "name=catdog-inference-container"
          if ($existing) {
            docker logs catdog-inference-container
          }
