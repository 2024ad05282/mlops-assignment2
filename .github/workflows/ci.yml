# ============================================================
# GitHub Actions CI Pipeline
# MLOps Assignment 2 - CI for Build, Test & Image Creation
# ============================================================
# Triggers on every push and pull request.
# Steps: Checkout -> Install Deps -> Run Tests -> Build Docker Image

name: CI Pipeline - Build, Test & Docker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOCKER_IMAGE_NAME: catdog-classifier
  PYTHON_VERSION: "3.13"

jobs:
  # ─── Job 1: Test ─────────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch for CI (no GPU in GitHub Actions)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install fastapi uvicorn python-multipart Pillow numpy scikit-learn matplotlib mlflow pytest
          pip install -r requirements.txt || true

      - name: Run Unit Tests
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  # ─── Job 2: Build & Publish Docker Image ──────────────────────
  build:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    needs: test  # Only build if tests pass
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          # Lowercase the owner name to prevent docker tagging issues
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER}/${{ env.DOCKER_IMAGE_NAME }}"
          
          docker build \
            -t ${IMAGE_TAG}:${{ github.sha }} \
            -t ${IMAGE_TAG}:latest \
            .

      - name: Test Docker Container Health
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER}/${{ env.DOCKER_IMAGE_NAME }}"
          
          # Start container in background
          docker run -d --name test-container -p 8000:8000 ${IMAGE_TAG}:latest

          # Wait for container to be ready
          echo "Waiting for container to start..."
          sleep 15

          # Test health endpoint
          curl -f http://localhost:8000/health || (docker logs test-container && exit 1)

          # Cleanup
          docker stop test-container
          docker rm test-container

      - name: Push Docker Image to GHCR
        if: github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER}/${{ env.DOCKER_IMAGE_NAME }}"
          
          docker push ${IMAGE_TAG}:${{ github.sha }}
          docker push ${IMAGE_TAG}:latest
